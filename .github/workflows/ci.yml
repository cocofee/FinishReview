name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]" -c constraints-dev.txt

      - name: Compile sources
        run: python -m compileall -q realtime tests

      - name: Lint critical errors
        run: python -m ruff check realtime tests tools

      - name: Run tests with coverage
        run: |
          python -m coverage erase
          python -m coverage run -m pytest -q --basetemp .pytest_tmp_ci
          python -m coverage report

  package:
    runs-on: windows-latest
    needs: test
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]" -c constraints-dev.txt

      - name: Ensure FFmpeg is available
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
          }
          ffmpeg -version | Select-Object -First 1

      - name: Build clean distribution
        shell: pwsh
        run: .\packaging\build.ps1

      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          $executable = ".\artifacts\dist\FinishReviewConsole\FinishReviewConsole.exe"
          $process = Start-Process -FilePath $executable -ArgumentList "--smoke-test" -PassThru
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force
            throw "Packaged executable smoke test timed out"
          }
          if ($process.ExitCode -ne 0) {
            throw "Packaged executable smoke test failed with exit code $($process.ExitCode)"
          }
