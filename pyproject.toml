[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finish-review"
version = "0.2.1"
description = "Standalone multi-source finish review console"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26,<3",
    "opencv-python>=4.10,<5",
    "PyQt5>=5.15,<6",
]

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7.15,<8",
    "pyinstaller>=6,<7",
    "pytest>=8,<10",
    "ruff>=0.16,<1",
]

[project.scripts]
finish-review = "realtime.review_main:main"

[tool.setuptools.packages.find]
include = ["realtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
branch = true
source = ["realtime"]

[tool.coverage.report]
show_missing = true
skip_empty = true
